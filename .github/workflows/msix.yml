name: MSIX

# Builds the Microsoft Store package.
# - Store package (unsigned; the Store signs it after certification): needs repository
#   variables STORE_IDENTITY_NAME, STORE_PUBLISHER, STORE_PUBLISHER_DISPLAY_NAME from
#   Partner Center (Product identity page). Upload the .msix in Partner Center.
# - Test package: same app with a test identity, signed with a throwaway self-signed
#   certificate so it can be sideloaded for testing. Never distribute it.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test tests/DiskCheckTW.Tests -c Release

      - name: Ensure python3 exists
        shell: bash
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\npython "$@"\n' > "$RUNNER_TEMP/bin/python3"
            chmod +x "$RUNNER_TEMP/bin/python3"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi

      - name: Publish app
        shell: bash
        run: bash build/publish.sh --publish-only

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = ([xml](Get-Content src/DiskCheckTW.App/DiskCheckTW.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "msix=$v.0" >> $env:GITHUB_OUTPUT
          "app=$v" >> $env:GITHUB_OUTPUT

      - name: Build Store package
        if: vars.STORE_IDENTITY_NAME != ''
        shell: pwsh
        run: >
          ./build/msix.ps1 -Version '${{ steps.version.outputs.msix }}'
          -IdentityName '${{ vars.STORE_IDENTITY_NAME }}'
          -Publisher '${{ vars.STORE_PUBLISHER }}'
          -PublisherDisplayName '${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}'
          -OutFile "$PWD/publish/store/DiskCheckTW-${{ steps.version.outputs.app }}-store.msix"

      - name: Build test package
        shell: pwsh
        run: >
          ./build/msix.ps1 -Version '${{ steps.version.outputs.msix }}'
          -IdentityName 'DiskCheckTW.Test'
          -Publisher 'CN=DiskCheckTW Test'
          -PublisherDisplayName 'DiskCheck TW test build'
          -OutFile "$PWD/publish/test/DiskCheckTW-${{ steps.version.outputs.app }}-test.msix"

      - name: Sign test package
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=DiskCheckTW Test' -KeyUsage DigitalSignature `
            -FriendlyName 'DiskCheck TW test' -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}') -NotAfter (Get-Date).AddDays(60)
          Export-Certificate -Cert $cert -FilePath publish/test/DiskCheckTW-test.cer | Out-Null
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Get-ChildItem publish/test/*.msix).FullName
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          @'
          Test install (Windows 10/11, PowerShell as administrator, in this folder):
            Import-Certificate -FilePath .\DiskCheckTW-test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople
            Add-AppxPackage -Path (Get-ChildItem .\DiskCheckTW-*-test.msix).FullName
          Remove after testing:
            Get-AppxPackage DiskCheckTW.Test | Remove-AppxPackage
            Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Subject -eq 'CN=DiskCheckTW Test' | Remove-Item
          '@ | Set-Content publish/test/INSTALL-TEST.txt -Encoding UTF8

      - name: Upload Store package
        if: vars.STORE_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v5
        with:
          name: DiskCheckTW-store-msix
          path: publish/store/*.msix

      - name: Upload test package
        uses: actions/upload-artifact@v5
        with:
          name: DiskCheckTW-test-msix
          path: publish/test/*
